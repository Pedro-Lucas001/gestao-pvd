project_id = "planeta-lanches"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 500

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[db.pooler]
enabled = true
port = 54329
pool_mode = "transaction"
default_pool_size = 15
max_client_conn = 100

[realtime]
enabled = true

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = []
enable_signup = false
minimum_password_length = 10

[functions.payment-intent]
verify_jwt = true

[functions.provider-webhook]
verify_jwt = false

[functions.checkout-payment]
verify_jwt = false

[functions.whatsapp-webhook]
verify_jwt = false

[functions.integration-worker]
verify_jwt = false

[functions.staff-admin]
verify_jwt = true

[functions.whatsapp-send]
verify_jwt = true

[functions.integration-status]
verify_jwt = true

# Endpoints alternativos: exigem exclusivamente o contrato SQL em português de sql_editor/.
[functions.eco-whatsapp-webhook]
verify_jwt = false

[functions.eco-gateway]
verify_jwt = false

[functions.eco-worker]
verify_jwt = false

[functions.eco-lgpd]
verify_jwt = false
