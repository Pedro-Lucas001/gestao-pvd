name: Validate PDV
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate
      - run: npm run validate
      - run: npm run activation:check
      - run: npm run test:db
      - run: bash scripts/test-activation.sh
      - run: bash scripts/test-sql-editor.sh
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.9.8
      - name: Check isolated Edge Functions
        env:
          DENO_NO_PACKAGE_JSON: "1"
        run: deno check --config=supabase/functions/deno.json --frozen supabase/functions/*/index.ts
      - name: Test isolated Edge Functions
        env:
          DENO_NO_PACKAGE_JSON: "1"
        run: deno test --config=supabase/functions/deno.json --frozen supabase/functions/_shared/*_test.ts
