name: Validate PDV
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm run activation:check
      - run: npm run test:db
      - run: bash scripts/test-activation.sh
      - run: bash scripts/test-sql-editor.sh
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.8
      - name: Check isolated Edge Functions
        env:
          DENO_NO_PACKAGE_JSON: "1"
        run: deno check --config=supabase/functions/deno.json supabase/functions/*/index.ts
      - name: Test isolated Edge Functions
        env:
          DENO_NO_PACKAGE_JSON: "1"
        run: deno test --config=supabase/functions/deno.json supabase/functions/_shared/*_test.ts
      - uses: actions/upload-artifact@v4
        with:
          name: edge-functions-lock
          path: supabase/functions/deno.lock
